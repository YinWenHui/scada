<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VetWard v3 — Hospital Room Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;--panel:#0b0f1c;--panel2:#0f1526;
  --border:#1a2a45;--border2:#243550;
  --cyan:#00d4ff;--cyan2:#0090b3;--cyan-dim:#003d52;
  --green:#00e676;--yellow:#ffcc00;--red:#ff3d3d;--orange:#ff8c00;
  --text:#c8d8f0;--muted:#3a5070;--muted2:#1e3050;
  --font-mono:'Share Tech Mono',monospace;
  --font-body:'Barlow',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body)}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:9999}

/* TOP BAR */
#topbar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(7,9,15,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;z-index:200;backdrop-filter:blur(8px)}
#tb-logo{padding:0 16px;font-family:var(--font-mono);font-size:13px;color:var(--cyan);letter-spacing:3px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;gap:8px;white-space:nowrap}
#tb-logo span{color:var(--muted);font-size:9px}
#tb-breadcrumb{padding:0 14px;font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:1;display:flex;align-items:center;gap:6px;overflow:hidden}
#tb-breadcrumb b{color:var(--cyan)}
/* SEARCH */
#search-wrap{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--border);border-right:1px solid var(--border)}
#search-input{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:4px 10px;border-radius:2px;outline:none;width:160px;transition:all .2s}
#search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-dim)}
#search-input::placeholder{color:var(--muted)}
#search-btn{background:var(--cyan-dim);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--font-mono);font-size:10px;padding:4px 10px;border-radius:2px;cursor:pointer;letter-spacing:1px;white-space:nowrap}
#search-btn:hover{background:var(--cyan);color:#000}
#search-results{position:absolute;top:48px;right:180px;background:var(--panel);border:1px solid var(--border2);border-top:none;width:240px;max-height:200px;overflow-y:auto;z-index:300;display:none}
.search-result-item{padding:8px 12px;font-family:var(--font-mono);font-size:10px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px}
.search-result-item:hover{background:var(--cyan-dim);color:var(--cyan)}
.search-result-item .sri-name{font-size:11px;color:var(--text)}
.search-result-item .sri-loc{font-size:9px;color:var(--muted)}
/* CONTROLS */
#tb-controls{display:flex;align-items:center;gap:6px;padding:0 12px}
.tbtn{background:transparent;border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:4px 10px;border-radius:2px;cursor:pointer;letter-spacing:1px;transition:all .15s;white-space:nowrap}
.tbtn:hover,.tbtn.active{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.tbtn.danger{border-color:var(--red);color:var(--red)}
.tbtn.danger:hover{background:rgba(255,61,61,.15)}
#tb-clock{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding:0 14px;border-left:1px solid var(--border);min-width:80px;white-space:nowrap}

/* ALERT — now a notification bell in topbar */
#tb-notif{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:32px;border:1px solid var(--border2);border-radius:2px;cursor:pointer;color:var(--muted);font-size:15px;transition:border-color .3s,color .3s;margin-left:4px}
#tb-notif:hover{border-color:var(--cyan);color:var(--cyan)}
#tb-notif.alert{border-color:var(--red);color:var(--red)}
/* Only the bell glyph blinks — keep border, badge, and dropdown stable/readable */
#tb-notif-icon{display:inline-block;line-height:1}
#tb-notif.alert #tb-notif-icon{animation:blink 1.2s infinite}
#tb-notif-count{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;background:var(--red);color:#fff;font-family:var(--font-mono);font-size:9px;font-weight:700;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px}
#tb-notif.alert #tb-notif-count{display:flex}
/* Dropdown — must be readable, NO blinking inherited */
#tb-notif-panel{position:absolute;top:44px;right:0;width:340px;max-height:420px;overflow-y:auto;background:rgba(5,7,12,.98);border:1px solid var(--red);border-radius:3px;z-index:300;display:none;backdrop-filter:blur(12px);animation:none !important}
#tb-notif-panel.show{display:block}
#tb-notif-panel *{animation:none}
.notif-header{padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:10px;color:var(--red);letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
.notif-item{padding:8px 12px;border-bottom:1px solid var(--muted2);cursor:pointer;font-family:var(--font-mono);font-size:10px;transition:background .15s;display:flex;gap:8px;align-items:flex-start;color:var(--text)}
.notif-item:hover{background:rgba(255,61,61,.1)}
/* Only the dot blinks — content is stable */
.notif-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.notif-dot.crit{background:var(--red);animation:blink .9s infinite}
.notif-dot.warn{background:var(--yellow);animation:blink 1.5s infinite}
.notif-body{flex:1;animation:none}
.notif-name{color:var(--text);font-weight:700;font-size:11px;margin-bottom:2px;animation:none}
.notif-meta{color:var(--muted);font-size:9px;letter-spacing:.5px;animation:none}
.notif-empty{padding:18px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* CANVAS */
#canvas-wrap{position:fixed;inset:0;top:48px}
#canvas-3d{display:block;width:100%;height:100%}

/* BOTTOM NAV */
#nav-bar{position:fixed;bottom:0;left:0;right:0;height:52px;background:rgba(7,9,15,.97);border-top:1px solid var(--border);display:flex;align-items:center;z-index:200;backdrop-filter:blur(8px)}
.nav-section{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--border)}
.nav-label{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:1px}
.nav-select{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:4px 8px;border-radius:2px;cursor:pointer;outline:none}
.nav-select:focus{border-color:var(--cyan)}
.nav-select option{background:#0b0f1c}
#nav-stats{flex:1;display:flex;align-items:center;gap:16px;padding:0 14px;font-family:var(--font-mono);font-size:10px}
.stat-item{display:flex;align-items:center;gap:5px;cursor:pointer}
.stat-item:hover .stat-dot{transform:scale(1.4)}
.stat-dot{width:6px;height:6px;border-radius:50%;transition:transform .2s}
#nav-zoom{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--border)}

/* SIDE PANEL */
#side-panel{position:fixed;right:0;top:48px;bottom:52px;width:320px;background:rgba(7,9,15,.98);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:170;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(12px)}
#side-panel.open{transform:translateX(0)}
#sp-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#sp-title{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:2px}
#sp-close{background:transparent;border:1px solid var(--border);color:var(--muted);width:24px;height:24px;border-radius:2px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
#sp-close:hover{border-color:var(--red);color:var(--red)}
#sp-addr{padding:8px 14px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:10px;color:var(--muted);flex-shrink:0}
#sp-addr b{color:var(--cyan)}
#sp-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sp-tab{flex:1;background:transparent;border:none;color:var(--muted);font-family:var(--font-mono);font-size:10px;padding:8px 4px;cursor:pointer;letter-spacing:1px;border-bottom:2px solid transparent;transition:all .2s}
.sp-tab:hover{color:var(--text)}
.sp-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
#sp-body{flex:1;overflow-y:auto;padding:12px 12px}
.sp-section{margin-bottom:12px}
.sp-sec-title{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:8px}
.vital-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--muted2)}
.vital-key{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.vital-val{font-size:12px;font-weight:600;font-family:var(--font-mono)}
/* EDITABLE VITAL */
.vital-edit-wrap{display:flex;align-items:center;gap:6px}
.vital-edit-input{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:2px;width:80px;outline:none;text-align:right}
.vital-edit-input:focus{border-color:var(--cyan)}
.vital-edit-select{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:2px 4px;border-radius:2px;outline:none}
.vital-edit-select:focus{border-color:var(--cyan)}
.vital-edit-select option{background:var(--panel)}
.cond-block{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:2px;padding:8px;margin-bottom:6px}
.cond-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cond-part-input{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:3px 6px;border-radius:2px;outline:none;width:100%;margin-bottom:4px}
.cond-part-input:focus{border-color:var(--cyan)}
.cond-sev-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.sev-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);font-family:var(--font-mono);font-size:9px;padding:2px 8px;border-radius:2px;cursor:pointer;transition:all .15s}
.sev-btn.active-1{border-color:var(--green);color:var(--green);background:rgba(0,230,118,.1)}
.sev-btn.active-2{border-color:var(--yellow);color:var(--yellow);background:rgba(255,204,0,.1)}
.sev-btn.active-3{border-color:var(--red);color:var(--red);background:rgba(255,61,61,.1)}
.cond-delete-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;transition:color .15s}
.cond-delete-btn:hover{color:var(--red)}
.add-cond-btn{width:100%;background:transparent;border:1px dashed var(--border2);color:var(--muted);font-family:var(--font-mono);font-size:10px;padding:6px;border-radius:2px;cursor:pointer;letter-spacing:1px;margin-top:4px;transition:all .2s}
.add-cond-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.save-patient-btn{width:100%;background:var(--cyan-dim);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--font-mono);font-size:11px;padding:8px;border-radius:2px;cursor:pointer;letter-spacing:2px;margin-top:8px;transition:all .2s}
.save-patient-btn:hover{background:var(--cyan);color:#000}
.sev-bar{height:3px;border-radius:2px;background:var(--muted2);margin-top:5px;overflow:hidden}
.sev-fill{height:100%;border-radius:2px;transition:width .5s}
#sp-dt-btn{margin:10px 12px;background:var(--cyan-dim);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--font-mono);font-size:10px;padding:8px;width:calc(100% - 24px);letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .2s;text-align:center}
#sp-dt-btn:hover{background:var(--cyan);color:#000}
#sp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;gap:10px;color:var(--muted);font-family:var(--font-mono);font-size:11px}
.assign-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);font-family:var(--font-mono);font-size:10px;padding:6px 12px;border-radius:2px;cursor:pointer;transition:all .2s;margin-top:8px}
.assign-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* HEATMAP OVERLAY - sits behind panels, full canvas area */
#heatmap-overlay{position:fixed;left:0;right:0;bottom:52px;top:48px;pointer-events:none;z-index:120;display:none}
#heatmap-overlay.show{display:block}
/* Heatmap toggle button floating bottom-right above nav */
#heatmap-toggle-btn{position:fixed;bottom:60px;right:14px;z-index:160;background:rgba(7,9,15,.92);border:1px solid var(--border2);color:var(--muted);font-family:var(--font-mono);font-size:9px;padding:5px 10px;border-radius:2px;cursor:pointer;letter-spacing:1px;transition:all .2s;display:flex;align-items:center;gap:5px}
#heatmap-toggle-btn.active{border-color:var(--orange);color:var(--orange);background:rgba(255,140,0,.12)}
#heatmap-toggle-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* TOOLTIP */
#tooltip{position:fixed;background:rgba(7,9,15,.96);border:1px solid var(--cyan2);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:10px;pointer-events:none;display:none;z-index:300;max-width:220px;line-height:1.6}

/* MINIMAP */
#minimap{position:fixed;bottom:60px;left:12px;z-index:150;background:rgba(7,9,15,.92);border:1px solid var(--border);border-radius:2px;padding:8px;cursor:pointer}
#minimap canvas{display:block}
#minimap-label{font-family:var(--font-mono);font-size:8px;color:var(--muted);letter-spacing:1px;text-align:center;margin-top:4px}
#minimap-toggle{font-family:var(--font-mono);font-size:8px;color:var(--cyan2);text-align:center;cursor:pointer;margin-top:2px}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.show{display:flex}
#modal-box{background:var(--panel);border:1px solid var(--border2);border-radius:3px;padding:24px;width:380px;max-width:90vw}
#modal-title{font-family:var(--font-mono);font-size:13px;color:var(--cyan);letter-spacing:2px;margin-bottom:16px}
#modal-body{margin-bottom:16px;font-size:13px;color:var(--text);line-height:1.6}
.modal-input{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:8px 10px;border-radius:2px;outline:none;margin-bottom:8px}
.modal-input:focus{border-color:var(--cyan)}
.modal-input option{background:var(--panel)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{background:transparent;border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:6px 16px;border-radius:2px;cursor:pointer;transition:all .15s}
.modal-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.modal-btn.primary{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.modal-btn.primary:hover{background:var(--cyan);color:#000}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ANIMATIONS */
@keyframes pY{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pR{0%,100%{opacity:.3}50%{opacity:1}}

/* HISTORY PANEL — left side, scrollable history log for selected patient */
#dt-panel{position:fixed;left:0;top:48px;bottom:52px;width:320px;background:rgba(3,5,9,.98);border-right:1px solid var(--cyan2);display:flex;flex-direction:column;z-index:160;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(12px)}
#dt-panel.open{transform:translateX(0);pointer-events:all}
#dt-shield{display:none}

#dt-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:42px;background:rgba(0,180,220,.03)}
#dt-title{font-family:var(--font-mono);font-size:10px;color:var(--cyan);letter-spacing:2px}
#dt-patient-name{font-family:var(--font-mono);font-size:11px;color:var(--text);font-weight:700;letter-spacing:1px;flex:1;text-align:center}
#dt-close{background:transparent;border:1px solid var(--border);color:var(--muted);width:24px;height:24px;border-radius:2px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s}
#dt-close:hover{border-color:var(--red);color:var(--red)}

/* Vital strip under header */
/* FLOATING STAGE HUD — anchored above the center stage cage in 3D world space */
#stage-hud{position:fixed;display:none;pointer-events:none;z-index:90;transform:translate(-50%,-100%);flex-direction:column;align-items:center;gap:5px;max-width:90vw}
#stage-hud.show{display:flex}
#stage-hud-top{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.stage-hud-box{display:flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(5,8,15,.82);border:1px solid var(--border2);border-radius:3px;font-family:var(--font-mono);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.6)}
.stage-hud-icon{font-size:16px;line-height:1}
.stage-hud-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.stage-hud-val{font-size:13px;font-weight:700;letter-spacing:1px}
.stage-hud-unit{font-size:8px;color:var(--muted);letter-spacing:1.5px;margin-top:1px}
.stage-hud-box.crit{border-color:var(--red);box-shadow:0 0 14px rgba(255,61,61,.45)}
.stage-hud-box.crit .stage-hud-val{color:var(--red)}
.stage-hud-box.crit .stage-hud-icon{color:var(--red);animation:blink 1.2s infinite}
.stage-hud-box.warn{border-color:var(--yellow);box-shadow:0 0 12px rgba(255,204,0,.3)}
.stage-hud-box.warn .stage-hud-val{color:var(--yellow)}
.stage-hud-box.warn .stage-hud-icon{color:var(--yellow)}
.stage-hud-box.ok{border-color:var(--green)}
.stage-hud-box.ok .stage-hud-val{color:var(--green)}
.stage-hud-box.ok .stage-hud-icon{color:var(--green)}
.stage-hud-box.neutral{border-color:var(--cyan2)}
.stage-hud-box.neutral .stage-hud-val{color:var(--cyan)}
.stage-hud-box.neutral .stage-hud-icon{color:var(--cyan)}
#stage-hud-name{padding:3px 10px;background:rgba(0,160,200,.1);border:1px solid var(--cyan2);border-radius:2px;font-family:var(--font-mono);font-size:10px;color:var(--cyan);letter-spacing:1.5px;backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.5);max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ANATOMY DIAGRAM — X-ray style silhouette with condition zones */
#stage-hud-anatomy{background:rgba(5,10,20,.82);border:1px solid var(--cyan2);border-radius:3px;padding:6px 8px;backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center;pointer-events:auto}
.anatomy-svg{width:70px;height:80px;flex-shrink:0}
.anatomy-svg .zone{fill:#1e3550;stroke:#3a5878;stroke-width:.8;transition:fill .2s,stroke .2s}
.anatomy-svg .zone.ok{fill:#0d3a28;stroke:#1e7a50}
.anatomy-svg .zone.warn{fill:#5a3b00;stroke:#ffcc00}
.anatomy-svg .zone.crit{fill:#6a1010;stroke:#ff3d3d;animation:blink 1.1s infinite}
.anatomy-svg .body-outline{fill:none;stroke:#6ab8d4;stroke-width:1.2;opacity:.8}
.anatomy-svg .zone:hover{stroke-width:2;cursor:pointer}
.anatomy-list{display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono);font-size:9px;min-width:110px}
.anatomy-list-empty{color:var(--green);font-size:9px;letter-spacing:1px}
.anatomy-row{display:flex;align-items:center;gap:5px;color:var(--text)}
.anatomy-row .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.anatomy-row.crit .dot{background:var(--red);animation:blink 1s infinite}
.anatomy-row.warn .dot{background:var(--yellow)}
.anatomy-row.ok .dot{background:var(--green)}
.anatomy-row .lbl{text-transform:uppercase;letter-spacing:.5px;font-size:8.5px}
.anatomy-row .sev{color:var(--muted);font-size:8px}

/* Control row — rotate arrows, walk, clear */
#stage-hud-controls{display:flex;gap:4px;pointer-events:auto;margin-top:2px}
.stage-ctrl-btn{background:rgba(5,8,15,.85);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:3px;cursor:pointer;letter-spacing:1px;transition:all .15s;backdrop-filter:blur(6px);display:flex;align-items:center;gap:4px}
.stage-ctrl-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,80,100,.4)}
.stage-ctrl-btn.walk{border-color:var(--orange);color:var(--orange)}
.stage-ctrl-btn.walk:hover{background:rgba(255,140,0,.15)}
.stage-ctrl-btn.clear{border-color:var(--red);color:var(--red)}
.stage-ctrl-btn.clear:hover{background:rgba(255,61,61,.15)}
.stage-ctrl-icon{font-size:13px;line-height:1}

/* History log body */
#dt-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:0}
#dt-log-title{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:2px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
#dt-log-count{color:var(--cyan);font-size:10px}
.hist-entry{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--muted2);font-size:11px}
.hist-time{font-family:var(--font-mono);font-size:9px;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:64px}
.hist-msg{color:var(--text);line-height:1.5;flex:1}
.hist-badge{display:inline-block;font-family:var(--font-mono);font-size:8px;padding:1px 6px;border-radius:1px;margin-right:6px;letter-spacing:1px}
.hist-empty{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;padding:30px 0}

#dt-add-note-btn{margin:10px 14px;background:transparent;border:1px dashed var(--cyan2);color:var(--cyan);font-family:var(--font-mono);font-size:10px;padding:8px;border-radius:2px;cursor:pointer;letter-spacing:2px;transition:all .2s;flex-shrink:0}
#dt-add-note-btn:hover{background:var(--cyan-dim);border-style:solid}
</style>
</head>

<script>
// ================================================================
// GLOBALS
// ================================================================
var scene, camera, renderer, clock;
var raycaster = null;
var mouse = null;
var camTarget = new THREE.Vector3(0,0,0);
var camTargetPos = new THREE.Vector3(0,12,14);

// DT scene globals
var dtScene, dtCamera, dtRenderer, dtClock;
var dtParts = {};
var dtAnimT = 0;
var dtPatient = null;

var WARD_CONFIG = { sides:2, rows:5, cols:4, cageW:1.6, cageH:1.4, cageD:1.5, aisleW:4.0, rowGap:2.0, colGap:0.25, stackLevels:2 };
var kennelMeshes = [];
var kennelData = {};     // key → patient
var selectedKennel = null;
var hoveredKennel = null;
var currentView = '3d';
var currentTab = 'info';
var heatmapVisible = false;
var filterStatus = null;
var minimapCells = [];

// Patient history log — patientId → [{time, type, tag, msg}]
var patientHistory = {};

var COL_EMPTY = 0x1a2840, COL_OK = 0x0d3321, COL_WARN = 0x3d2b00, COL_CRIT = 0x4a0a0a;
var COL_FRAME = 0x0d1f35, COL_SEL = 0x004060;
var EMIT_OK = 0x00e676, EMIT_WARN = 0xffcc00, EMIT_CRIT = 0xff3d3d;
var camState = { h:0.4, v:0.55, dist:14 };

// ================================================================
// INIT MAIN SCENE
// ================================================================
function init() {
  var canvas = document.getElementById('canvas-3d');
  var wrap = document.getElementById('canvas-wrap');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07090f);
  scene.fog = new THREE.FogExp2(0x07090f, 0.018);

  camera = new THREE.PerspectiveCamera(55, wrap.clientWidth/wrap.clientHeight, 0.1, 200);

  renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene.add(new THREE.AmbientLight(0x1a2a4a, 1.8));
  var key = new THREE.DirectionalLight(0x4090d0, 2.0);
  key.position.set(5,12,8); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=50;
  key.shadow.camera.left=-20; key.shadow.camera.right=20;
  key.shadow.camera.top=20; key.shadow.camera.bottom=-20;
  scene.add(key);
  scene.add(new THREE.DirectionalLight(0x0a2040,0.8).position.set(-5,4,-5));
  [-6,6].forEach(function(x){ var s=new THREE.PointLight(0x00aacc,0.6,20); s.position.set(x,6,0); scene.add(s); });

  // Center stage spotlight — illuminates the conveyor belt landing zone
  var stageSpot=new THREE.SpotLight(0x80ccff, 0, 60, Math.PI/5, 0.4, 1.5);
  stageSpot.position.set(0,7,3); stageSpot.target.position.set(0,0,2.5);
  stageSpot.castShadow=false; scene.add(stageSpot); scene.add(stageSpot.target);
  window._stageSpot=stageSpot; // reference for animation

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2(-999,-999);
  clock = new THREE.Clock();

  buildRoom(); buildKennels(); setupNavDropdowns(); setupEvents();
  loadDemo(); animate(); updateClock(); setInterval(updateClock,1000);

  window.addEventListener('resize', function(){
    var w=wrap.clientWidth, h=wrap.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  });
}

// ================================================================
// ROOM GEOMETRY
// ================================================================
function buildRoom() {
  var roomW=22, roomD=20, roomH=8;
  var floorMat = new THREE.MeshStandardMaterial({color:0x0a1020,roughness:0.9,metalness:0.1});
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW,roomD), floorMat);
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  scene.add(new THREE.GridHelper(roomW, 22, 0x0d2040, 0x0a1828));
  var ceil = new THREE.Mesh(new THREE.PlaneGeometry(roomW,roomD), new THREE.MeshStandardMaterial({color:0x080c18,roughness:1}));
  ceil.rotation.x=Math.PI/2; ceil.position.y=roomH; scene.add(ceil);
  var wallMat = new THREE.MeshStandardMaterial({color:0x090d1a,roughness:0.9});
  [{w:roomW,h:roomH,x:0,y:roomH/2,z:-roomD/2,ry:0},{w:roomW,h:roomH,x:0,y:roomH/2,z:roomD/2,ry:Math.PI},{w:roomD,h:roomH,x:-roomW/2,y:roomH/2,z:0,ry:Math.PI/2},{w:roomD,h:roomH,x:roomW/2,y:roomH/2,z:0,ry:-Math.PI/2}].forEach(function(w){
    var m=new THREE.Mesh(new THREE.PlaneGeometry(w.w,w.h),wallMat.clone()); m.position.set(w.x,w.y,w.z); m.rotation.y=w.ry; m.receiveShadow=true; scene.add(m);
  });
  [-8,-2,4].forEach(function(z){
    var lt=new THREE.Mesh(new THREE.BoxGeometry(16,0.08,0.12),new THREE.MeshStandardMaterial({color:0x00aacc,emissive:0x005566,emissiveIntensity:0.8}));
    lt.position.set(0,roomH-0.1,z); scene.add(lt);
  });
  var aisle=new THREE.Mesh(new THREE.PlaneGeometry(WARD_CONFIG.aisleW-0.4,roomD-2),new THREE.MeshStandardMaterial({color:0x0a1828,roughness:1}));
  aisle.rotation.x=-Math.PI/2; aisle.position.y=0.005; scene.add(aisle);

  // CENTER STAGE floor ring — glows when a patient is brought for examination
  var ringGeo = new THREE.RingGeometry(0.88, 1.06, 48);
  var ringMat = new THREE.MeshStandardMaterial({color:0x00aacc, emissive:new THREE.Color(0x00aacc), emissiveIntensity:0.3, side:THREE.DoubleSide, transparent:true, opacity:0.55});
  var stageRing = new THREE.Mesh(ringGeo, ringMat);
  stageRing.rotation.x = -Math.PI/2; stageRing.position.set(0, 0.008, 2.5); scene.add(stageRing);
  var padGeo = new THREE.CircleGeometry(0.88, 48);
  var padMat = new THREE.MeshStandardMaterial({color:0x001a28, roughness:1, transparent:true, opacity:0.55});
  var stagePad = new THREE.Mesh(padGeo, padMat);
  stagePad.rotation.x = -Math.PI/2; stagePad.position.set(0, 0.006, 2.5); scene.add(stagePad);
  // Store for animation
  window._stageRingMat = ringMat;
  window._stagePadMat  = padMat;
}

// ================================================================
// KENNELS
// ================================================================
function buildKennels() {
  kennelMeshes=[];
  var cfg=WARD_CONFIG;
  var sides=[{name:'LEFT',xDir:-1},{name:'RIGHT',xDir:1}];
  sides.forEach(function(side){
    var baseX=side.xDir*(cfg.aisleW/2+0.2);
    for(var row=0;row<cfg.rows;row++){
      var zPos=(row-(cfg.rows-1)/2)*(cfg.cageD+cfg.rowGap);
      for(var col=0;col<cfg.cols;col++){
        var xPos=baseX+side.xDir*(col*(cfg.cageW+cfg.colGap)+cfg.cageW/2);
        for(var lv=0;lv<cfg.stackLevels;lv++){
          var yPos=lv*(cfg.cageH+0.15)+cfg.cageH/2+0.05;
          buildOneCage(side.name,row,col,lv,xPos,yPos,zPos);
        }
      }
    }
  });
}

function buildOneCage(side,row,col,level,x,y,z) {
  var cfg=WARD_CONFIG;
  var key=side+'-'+row+'-'+col+'-'+level;
  var group=new THREE.Group(); group.position.set(x,y,z);
  var panelMat=new THREE.MeshStandardMaterial({color:COL_FRAME,roughness:0.6,metalness:0.3});
  var back=new THREE.Mesh(new THREE.BoxGeometry(cfg.cageW-0.06,cfg.cageH-0.06,0.04),panelMat.clone()); back.position.z=-cfg.cageD/2+0.02; group.add(back);
  var cFloor=new THREE.Mesh(new THREE.BoxGeometry(cfg.cageW-0.06,0.04,cfg.cageD-0.06),panelMat.clone()); cFloor.position.y=-cfg.cageH/2+0.02; group.add(cFloor);
  [-1,1].forEach(function(sx){ var sp=new THREE.Mesh(new THREE.BoxGeometry(0.04,cfg.cageH-0.06,cfg.cageD-0.06),panelMat.clone()); sp.position.x=sx*(cfg.cageW/2-0.02); group.add(sp); });
  var top=new THREE.Mesh(new THREE.BoxGeometry(cfg.cageW-0.06,0.04,cfg.cageD-0.06),panelMat.clone()); top.position.y=cfg.cageH/2-0.02; group.add(top);
  var glowMat=new THREE.MeshStandardMaterial({color:COL_EMPTY,roughness:0.8,emissive:0x000000,emissiveIntensity:0});
  var interior=new THREE.Mesh(new THREE.BoxGeometry(cfg.cageW-0.14,cfg.cageH-0.14,cfg.cageD-0.14),glowMat);
  interior.userData={key:key,side:side,row:row,col:col,level:level,isInterior:true}; group.add(interior);
  var barMat=new THREE.MeshStandardMaterial({color:0x1a3a5a,roughness:0.4,metalness:0.7,transparent:true,opacity:0.85});
  var barMeshes=[];
  for(var b=0;b<7;b++){
    var bx=-cfg.cageW/2+(b/6)*cfg.cageW;
    var bar=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,cfg.cageH-0.08,5),barMat.clone()); bar.position.set(bx,0,cfg.cageD/2-0.02); group.add(bar);
    barMeshes.push(bar);
  }
  var hbarMeshes=[];
  [-1,0,1].forEach(function(hy){ var hb=new THREE.Mesh(new THREE.BoxGeometry(cfg.cageW,0.03,0.03),barMat.clone()); hb.position.set(0,hy*(cfg.cageH/2-0.1),cfg.cageD/2-0.02); group.add(hb); hbarMeshes.push(hb); });
  var statusLightMat=new THREE.MeshStandardMaterial({color:0x111111,emissive:0x003333,emissiveIntensity:0.5});
  var statusLight=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,6),statusLightMat); statusLight.position.set(cfg.cageW/2-0.1,cfg.cageH/2-0.12,cfg.cageD/2+0.02); statusLight.userData.isStatusLight=true; group.add(statusLight);
  var plateMat=new THREE.MeshStandardMaterial({color:0x0d1a2a,roughness:0.5});
  var plate=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.02),plateMat); plate.position.set(0,cfg.cageH/2+0.07,cfg.cageD/2-0.1); group.add(plate);
  var edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(cfg.cageW,cfg.cageH,cfg.cageD)),new THREE.LineBasicMaterial({color:0x1a3a5a,transparent:true,opacity:0.5})); group.add(edges);
  group.castShadow=true; group.userData={key:key,side:side,row:row,col:col,level:level}; scene.add(group);
  kennelMeshes.push({group:group,interior:interior,statusLight:statusLight,edges:edges,back:back,barMeshes:barMeshes,hbarMeshes:hbarMeshes,key:key,side:side,row:row,col:col,level:level,x:x,y:y,z:z});
}

// ================================================================
// UPDATE VISUALS
// ================================================================
function getPatientStatus(patient) {
  if(!patient) return 'empty';
  var maxSev=0; (patient.conditions||[]).forEach(function(c){if(c.severity>maxSev)maxSev=c.severity;});
  if(maxSev>=3||patient.temp>39.5) return 'crit';
  if(maxSev>=2) return 'warn';
  return 'ok';
}

function updateKennelVisual(km, patient, isSelected) {
  var col,emi,emiInt,sCol;
  var st=getPatientStatus(patient);
  if(st==='empty'){col=COL_EMPTY;emi=0x001122;emiInt=0.1;sCol=0x002233;}
  else if(st==='crit'){col=COL_CRIT;emi=EMIT_CRIT;emiInt=0.35;sCol=0xff3d3d;}
  else if(st==='warn'){col=COL_WARN;emi=EMIT_WARN;emiInt=0.25;sCol=0xffcc00;}
  else{col=COL_OK;emi=EMIT_OK;emiInt=0.12;sCol=0x00e676;}

  // Filter dimming
  if(filterStatus && st!==filterStatus){emiInt=0.03;col=COL_EMPTY;sCol=0x002233;}

  if(isSelected){col=COL_SEL;emi=0x00aacc;emiInt=0.5;}
  km.interior.material.color.setHex(col);
  km.interior.material.emissive.setHex(emi);
  km.interior.material.emissiveIntensity=emiInt;
  // Make interior glow box transparent when selected — so the cat inside is visible
  if(!km.interior.material.transparent){ km.interior.material.transparent = true; }
  km.interior.material.opacity = isSelected ? 0.15 : 1.0;
  km.statusLight.material.emissive.setHex(patient?sCol:0x001122);
  km.statusLight.material.emissiveIntensity=patient?0.8:0.2;
  km.edges.material.color.setHex(isSelected?0x00d4ff:(patient?0x1a3a5a:0x0d1f2e));
  km.edges.material.opacity=isSelected?1:0.5;
  km.back.material.color.setHex(isSelected?0x003355:col);
  // Make front bars AND back/top/side panels transparent when selected so the patient inside is visible
  var barOpacity=isSelected?0.08:0.85;
  var barColor=isSelected?0x00aacc:0x1a3a5a;
  if(km.barMeshes) km.barMeshes.forEach(function(b){b.material.opacity=barOpacity;b.material.color.setHex(barColor);b.material.emissive&&b.material.emissive.setHex(isSelected?0x003344:0x000000);});
  if(km.hbarMeshes) km.hbarMeshes.forEach(function(b){b.material.opacity=barOpacity;b.material.color.setHex(barColor);});
  // Back panel too
  if(!km.back.material.transparent){ km.back.material.transparent=true; }
  km.back.material.opacity = isSelected ? 0.25 : 1.0;
}

function refreshAllKennels() {
  kennelMeshes.forEach(function(km){
    var patient=kennelData[km.key]||null;
    var isSel=selectedKennel&&selectedKennel.key===km.key;
    updateKennelVisual(km,patient,isSel);
  });
  updateStats(); updateMinimap(); if(heatmapVisible) drawHeatmap();
}

// ================================================================
// CAMERA
// ================================================================
function updateCamera() {
  var h=camState.h,v=camState.v,d=camState.dist;
  var px=camTarget.x+Math.sin(h)*Math.cos(v)*d;
  var py=camTarget.y+Math.sin(v)*d;
  var pz=camTarget.z+Math.cos(h)*Math.cos(v)*d;
  camTargetPos.set(px,py,pz);
}
// ================================================================
// CENTER STAGE — "conveyor belt" system
// Selected kennel's group animates to world center (0,y,0),
// camera locks on it from the front, panel shows data.
// On deselect the group returns to its original position.
// ================================================================
var stageActive = false;
var stageKm = null;          // currently staged kennel
var stageOrigPos = null;     // {x,y,z} original world position
var stageLerpT = 0;          // 0→1 animation progress
var stageDir = 1;            // 1=going to center, -1=returning
var STAGE_CENTER = new THREE.Vector3(0, 1.0, 2.5); // front-center of room
var STAGE_CAM_POS = new THREE.Vector3(0, 1.4, 5.5); // camera looks straight at it
var stageCamTarget = new THREE.Vector3(0, 1.0, 2.5);
var stageCamPos = new THREE.Vector3(0, 1.4, 5.5);
var stageAnimating = false;

function focusKennel(km) {
  // If another kennel is currently staged, return it first then stage new one
  if(stageKm && stageKm.key !== km.key) {
    returnStage(function(){ beginStage(km); });
    return;
  }
  beginStage(km);
}

function beginStage(km) {
  stageKm = km;
  stageOrigPos = {x: km.group.position.x, y: km.group.position.y, z: km.group.position.z};
  stageLerpT = 0;
  stageDir = 1;
  stageActive = true;
  stageAnimating = true;
  // Reset rotation for new staged cage
  stageRotY = 0;
  stageRotX = 0;

  // Camera: move to front-stage position looking at center
  stageCamTarget.copy(STAGE_CENTER);
  stageCamPos.copy(STAGE_CAM_POS);

  // Smooth camera to front
  camTarget.copy(STAGE_CENTER);
  camTargetPos.copy(STAGE_CAM_POS);
}

function returnStage(callback) {
  if(!stageKm) { if(callback) callback(); return; }
  stageDir = -1;
  stageAnimating = true;
  var _km = stageKm;
  var _orig = stageOrigPos;
  var _cb = callback;
  // We'll handle this in the animate loop via stageDir=-1
  // Store callback to fire when done
  stageReturnCallback = _cb;
}
var stageReturnCallback = null;

function updateStageAnimation(dt) {
  if(!stageAnimating || !stageKm) return;
  var speed = 2.2; // lerp units per second
  stageLerpT = Math.min(1, stageLerpT + dt * speed);

  var t = easeInOut(stageLerpT);

  if(stageDir === 1) {
    // Moving to center
    stageKm.group.position.x = lerp(stageOrigPos.x, STAGE_CENTER.x, t);
    stageKm.group.position.y = lerp(stageOrigPos.y, STAGE_CENTER.y, t);
    stageKm.group.position.z = lerp(stageOrigPos.z, STAGE_CENTER.z, t);
    if(stageLerpT >= 1) { stageAnimating = false; }
  } else {
    // Returning
    stageKm.group.position.x = lerp(STAGE_CENTER.x, stageOrigPos.x, t);
    stageKm.group.position.y = lerp(STAGE_CENTER.y, stageOrigPos.y, t);
    stageKm.group.position.z = lerp(STAGE_CENTER.z, stageOrigPos.z, t);
    if(stageLerpT >= 1) {
      stageKm.group.position.set(stageOrigPos.x, stageOrigPos.y, stageOrigPos.z);
      stageKm.group.rotation.set(0, 0, 0);
      stageRotY = 0; stageRotX = 0;
      stageAnimating = false;
      stageActive = false;
      stageKm = null;
      stageOrigPos = null;
      if(stageReturnCallback){ stageReturnCallback(); stageReturnCallback=null; }
    }
  }
}

function resetCamera() {
  // If a kennel is staged, return it first
  if(stageKm) {
    stageDir = -1;
    stageAnimating = true;
    stageLerpT = 0;
  }
  camTarget.set(0,1.5,0);
  camState.dist=14; camState.v=0.55; camState.h=0.4;
  updateCamera();
}

function setZoom(val) { camState.dist=parseFloat(val); updateCamera(); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeInOut(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

// ================================================================
// ORBIT CONTROLS
// ================================================================
var orbitActive=false, orbitStart={x:0,y:0}, pinchStart=0;
// Rotation applied to staged cage group (reset on stage return)
var stageRotY = 0;
var stageRotX = 0;

function setupOrbit() {
  var canvas=document.getElementById('canvas-3d');
  canvas.addEventListener('mousedown',function(e){orbitActive=true;orbitStart.x=e.clientX;orbitStart.y=e.clientY;});
  window.addEventListener('mouseup',function(){orbitActive=false;});
  window.addEventListener('mousemove',function(e){
    if(orbitActive){
      var dx=(e.clientX-orbitStart.x), dy=(e.clientY-orbitStart.y);
      if(stageActive && stageKm){
        // Drag rotates the staged cage (patient inside)
        stageRotY -= dx*0.01;
        stageRotX = Math.max(-0.6, Math.min(0.6, stageRotX - dy*0.008));
      } else {
        // Normal camera orbit
        camState.h -= dx*0.007;
        camState.v = Math.max(0.1, Math.min(1.3, camState.v - dy*0.007));
        updateCamera();
      }
      orbitStart.x=e.clientX; orbitStart.y=e.clientY;
    }
    handleHover(e);
  });
  canvas.addEventListener('wheel',function(e){e.preventDefault();camState.dist=Math.max(4,Math.min(20,camState.dist+e.deltaY*0.02));document.getElementById('zoom-slider').value=camState.dist;updateCamera();},{passive:false});
  var t0=null;
  canvas.addEventListener('touchstart',function(e){
    if(e.touches.length===1){orbitActive=true;t0={x:e.touches[0].clientX,y:e.touches[0].clientY};}
    else if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  });
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(e.touches.length===1&&t0){
      var dx=(e.touches[0].clientX-t0.x), dy=(e.touches[0].clientY-t0.y);
      if(stageActive && stageKm){
        stageRotY -= dx*0.012;
        stageRotX = Math.max(-0.6, Math.min(0.6, stageRotX - dy*0.01));
      } else {
        camState.h -= dx*0.008;
        camState.v = Math.max(0.1, Math.min(1.3, camState.v - dy*0.008));
        updateCamera();
      }
      t0={x:e.touches[0].clientX,y:e.touches[0].clientY};
    } else if(e.touches.length===2){
      var pinchNow=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      camState.dist=Math.max(4,Math.min(20,camState.dist-(pinchNow-pinchStart)*0.03));
      pinchStart=pinchNow; document.getElementById('zoom-slider').value=camState.dist; updateCamera();
    }
  },{passive:false});
  canvas.addEventListener('touchend',function(){orbitActive=false;t0=null;});
}

// ================================================================
// EVENTS / CLICK
// ================================================================
function setupEvents() { setupOrbit(); document.getElementById('canvas-3d').addEventListener('click',function(e){handleClick(e);}); resetCamera(); }

function getHitKennel(cx,cy) {
  if(!raycaster||!mouse) return null;
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((cx-rect.left)/rect.width)*2-1;
  mouse.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var interiors=kennelMeshes.map(function(km){return km.interior;});
  var hits=raycaster.intersectObjects(interiors);
  if(!hits.length) return null;
  return kennelMeshes.find(function(km){return km.interior===hits[0].object;})||null;
}

function handleClick(e) {
  // First priority: if stage model is visible, try to hit a body part
  if(stageModel && stageModelParts && raycaster && mouse) {
    var rect=renderer.domElement.getBoundingClientRect();
    mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var allParts=[];
    Object.values(stageModelParts).forEach(function(arr){ if(Array.isArray(arr)) allParts=allParts.concat(arr); });
    if(allParts.length){
      var hits=raycaster.intersectObjects(allParts,true);
      if(hits.length){
        // Find which part name was hit
        var hit=hits[0].object;
        var partName=null;
        Object.entries(stageModelParts).forEach(function(kv){
          if(Array.isArray(kv[1]) && kv[1].indexOf(hit)>=0) partName=kv[0];
        });
        if(partName){ highlightStagePart(partName); return; }
      }
    }
  }

  // Otherwise normal kennel click
  var km=getHitKennel(e.clientX,e.clientY);
  if(!km){closePanel();return;}
  selectedKennel=km; focusKennel(km); refreshAllKennels();
  openPanel(km); updateBreadcrumb(km.side,km.row+1,km.col+1);
}

function handleHover(e) {
  var tip=document.getElementById('tooltip');

  // First: hover on stage model parts → show part tooltip
  if(stageModel && stageModelParts && raycaster && mouse) {
    var rect=renderer.domElement.getBoundingClientRect();
    mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var allParts=[];
    Object.values(stageModelParts).forEach(function(arr){ if(Array.isArray(arr)) allParts=allParts.concat(arr); });
    if(allParts.length){
      var hits=raycaster.intersectObjects(allParts,true);
      if(hits.length){
        var hit=hits[0].object;
        var partName=null;
        Object.entries(stageModelParts).forEach(function(kv){
          if(Array.isArray(kv[1]) && kv[1].indexOf(hit)>=0) partName=kv[0];
        });
        if(partName){
          var cond=null;
          if(dtPatient && dtPatient.conditions) cond=dtPatient.conditions.find(function(c){return c.part===partName;});
          var sc=cond?(cond.severity>=3?'var(--red)':cond.severity>=2?'var(--yellow)':'var(--green)'):'var(--muted)';
          var inner='<span style="color:var(--cyan);font-weight:700">'+partName.replace(/_/g,' ').toUpperCase()+'</span>';
          if(cond){
            inner+=' <span style="color:'+sc+'">SEV '+cond.severity+'/3</span>';
            inner+='<br/>'+cond.condition;
          } else {
            inner+='<br/><span style="color:var(--muted)">No condition recorded</span>';
          }
          tip.innerHTML=inner;
          tip.style.display='block';
          tip.style.left=(e.clientX+14)+'px';
          tip.style.top=(e.clientY-8)+'px';
          return;
        }
      }
    }
  }

  // Otherwise normal kennel hover
  var km=getHitKennel(e.clientX,e.clientY);
  if(km){
    var patient=kennelData[km.key]||null;
    tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px';
    var inner='<span style="color:var(--cyan)">'+km.side+' · ROW '+(km.row+1)+' · COL '+(km.col+1)+(km.level>0?' · LV'+(km.level+1):'')+'</span>';
    if(patient){
      var maxSev=0;(patient.conditions||[]).forEach(function(c){if(c.severity>maxSev)maxSev=c.severity;});
      var sc=maxSev>=3?'var(--red)':maxSev>=2?'var(--yellow)':'var(--green)';
      inner+='<br/><b>'+patient.name+'</b> <span style="color:'+sc+'">[SEV'+maxSev+']</span>';
      inner+='<br/><span style="color:var(--muted)">'+patient.temp.toFixed(1)+'°C · '+patient.heartRate+' bpm</span>';
      if(patient.temp>39.5) inner+='<br/><span style="color:var(--red)">🌡 FEVER</span>';
    } else { inner+='<br/><span style="color:var(--muted)">EMPTY — click to assign</span>'; }
    tip.innerHTML=inner;
  } else { tip.style.display='none'; }
}

function conditionRowHTML(c,i){

function savePatient(kennelKey) {
  var id=document.getElementById('edit-id').value.trim();
  var name=document.getElementById('edit-name').value.trim();
  var species=document.getElementById('edit-species').value;
  var temp=parseFloat(document.getElementById('edit-temp').value)||38.5;
  var hr=parseInt(document.getElementById('edit-hr').value)||100;
  var status=document.getElementById('edit-status').value;
  if(!name){alert('Name required');return;}

  // Collect conditions
  var conds=[];
  var blocks=document.getElementById('conditions-list').querySelectorAll('.cond-block');
  blocks.forEach(function(b,i){
    var part=b.querySelector('[id^="cond-part-"]').value;
    var condName=b.querySelector('[id^="cond-name-"]').value.trim();
    var sev=1;
    [1,2,3].forEach(function(s){var btn=b.querySelector('.sev-btn.active-'+s);if(btn)sev=s;});
    if(condName) conds.push({part:part,condition:condName,severity:sev});
  });

  var pid=id||kennelKey;
  var existed=!!kennelData[kennelKey];
  kennelData[kennelKey]={id:pid,name:name,species:species,temp:temp,heartRate:hr,status:status,conditions:conds,kennelKey:kennelKey};
  // Log history
  var st=getPatientStatus(kennelData[kennelKey]);
  logHistory(pid, st==='crit'?'crit':st==='warn'?'warn':'info', existed?'EDIT':'ADMIT', existed?'Record updated · '+temp.toFixed(1)+'°C · '+hr+' bpm':'Patient admitted · '+species.toUpperCase()+' · '+temp.toFixed(1)+'°C');
  if(temp>39.5) logHistory(pid,'crit','FEVER','Temperature '+temp.toFixed(1)+'°C exceeds threshold');
  refreshAllKennels();
  if(currentPanelKm) { openPanel(currentPanelKm); currentTab='info'; switchTab('info'); }
  showToast('Patient saved ✓');
}

function removePatientFromKennel() {
  if(!currentPanelKm) return;
  if(!confirm('Remove patient from this kennel?')) return;
  var pid = kennelData[currentPanelKm.key] ? kennelData[currentPanelKm.key].id : null;
  delete kennelData[currentPanelKm.key];
  if(pid) logHistory(pid, 'warn', 'DISCHG', 'Patient removed from '+currentPanelKm.key);
  refreshAllKennels();
  showToast('Patient removed');
  // Close everything and return cage to shelf
  closePanel();
}

  function zoneClass(part){
    var c=partSev[part]; if(!c) return '';

    var cls=zoneClass(part);

// Position the HUD in screen space by projecting STAGE_CENTER top
function positionStageHUD(){
  var hud=document.getElementById('stage-hud');
  if(!hud.classList.contains('show')) return;
  if(!stageActive && !stageAnimating){ hud.classList.remove('show'); return; }

  // Project a point above the cage top to screen
  var topPt = new THREE.Vector3(STAGE_CENTER.x, STAGE_CENTER.y + WARD_CONFIG.cageH/2 + 0.6, STAGE_CENTER.z);
  var sp = topPt.clone().project(camera);
  if(sp.z>=1){ hud.style.visibility='hidden'; return; }
  hud.style.visibility='visible';

  var rect = renderer.domElement.getBoundingClientRect();
  var sx = (sp.x+1)/2*rect.width + rect.left;
  var sy = (-sp.y+1)/2*rect.height + rect.top;

  // Measure HUD size and clamp within canvas bounds so it never goes off-screen
  var hudW = hud.offsetWidth || 400;
  var hudH = hud.offsetHeight || 100;
  // Padding margin from viewport edges
  var m = 10;
  // Left/right panel widths
  var leftInset = document.getElementById('dt-panel').classList.contains('open') ? 320 : 0;
  var rightInset = document.getElementById('side-panel').classList.contains('open') ? 320 : 0;

  // Current transform is translate(-50%,-100%), so sx is center and sy is bottom edge.
  // Clamp center x so HUD stays within [leftInset + hudW/2 + m, rect.right - rightInset - hudW/2 - m]
  var minX = rect.left + leftInset + hudW/2 + m;
  var maxX = rect.right - rightInset - hudW/2 - m;
  if(maxX > minX){ sx = Math.max(minX, Math.min(maxX, sx)); }

  // Clamp sy so HUD bottom stays at least hudH + m below top of canvas
  var minY = rect.top + hudH + m;
  var maxY = rect.bottom - m;
  sy = Math.max(minY, Math.min(maxY, sy));

  hud.style.left = sx+'px';
  hud.style.top  = sy+'px';
}

// ----- WALKOUT ANIMATION -----
// Patient walks out of the cage, rotates 360°, walks back in
var walkoutState = null; // null | 'walking_out' | 'turning' | 'walking_back'
var walkoutT = 0;

function startWalkout() {
  if(!stageModel||!stageKm||walkoutState) return;
  walkoutState = 'walking_out';
  walkoutT = 0;
  logHistory(dtPatient.id,'info','INSPECT','Full-body inspection initiated');
  if(currentPanelKm) renderTab(currentPanelKm);
  renderHistoryPanel(dtPatient);
}

function updateWalkout(dt) {
  if(!walkoutState||!stageModel) return;
  walkoutT += dt;

  // Parameters
  var walkDuration = 1.6;   // seconds to walk out/in
  var turnDuration = 2.2;   // seconds to spin
  var walkDistance = 1.8;   // how far forward (positive Z in kennel local space)

  // Convert cage-local direction: the cage's +Z is front of cage (toward camera).
  // The model is parented to stageKm.group, so local +Z is forward.
  if(walkoutState === 'walking_out'){
    var t = Math.min(1, walkoutT / walkDuration);
    var eased = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    stageModel.position.z = eased * walkDistance;
    // Tiny bob to simulate walking gait
    stageModel.position.y = (-WARD_CONFIG.cageH/2 + 0.15) + Math.abs(Math.sin(walkoutT*8))*0.03;
    // Reset rotation during walk out
    stageModel.rotation.y = 0;
    if(t >= 1){ walkoutState = 'turning'; walkoutT = 0; }
  } else if(walkoutState === 'turning'){
    var t = Math.min(1, walkoutT / turnDuration);
    var eased = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    stageModel.rotation.y = eased * Math.PI * 2; // 360
    stageModel.position.y = (-WARD_CONFIG.cageH/2 + 0.15);
    if(t >= 1){ walkoutState = 'walking_back'; walkoutT = 0; stageModel.rotation.y = 0; }
  } else if(walkoutState === 'walking_back'){
    var t = Math.min(1, walkoutT / walkDuration);
    var eased = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    stageModel.position.z = (1 - eased) * walkDistance;
    stageModel.position.y = (-WARD_CONFIG.cageH/2 + 0.15) + Math.abs(Math.sin(walkoutT*8))*0.03;
    stageModel.rotation.y = 0;
    if(t >= 1){
      // Reset to cage interior position
      stageModel.position.set(0, -WARD_CONFIG.cageH/2 + 0.15, 0);
      stageModel.rotation.y = 0;
      walkoutState = null;
      walkoutT = 0;
    }
  }
}

// ================================================================
// STAGE MODEL — cat/dog model built into main scene, attached to staged kennel
// ================================================================
var stageModel = null;        // THREE.Group containing the animal
var stageModelParts = {};     // partName -> [meshes] (for highlighting)

function removeStageModel() {
  if(stageModel && stageModel.parent) stageModel.parent.remove(stageModel);
  stageModel = null;
  stageModelParts = {};
  walkoutState = null;
  walkoutT = 0;
}

function buildStageModel(patient) {
  removeStageModel();
  if(!patient || !stageKm) return;

  var condMap={};
  if(patient.conditions) patient.conditions.forEach(function(c){ condMap[c.part]={severity:c.severity,condition:c.condition}; });

  function getPartColor(partName){
    var c=condMap[partName];
    if(!c) return {col:0x88c8e0,emi:0x1a4050,ei:0.35};
    if(c.severity>=3) return {col:0x9a2020,emi:EMIT_CRIT,ei:0.7};
    if(c.severity>=2) return {col:0x8a5500,emi:EMIT_WARN,ei:0.6};
    return {col:0x1e7a50,emi:EMIT_OK,ei:0.4};
  }
  function mkMat(partName){
    var s=getPartColor(partName);
    return new THREE.MeshStandardMaterial({color:s.col,roughness:0.65,metalness:0.1,emissive:new THREE.Color(s.emi),emissiveIntensity:s.ei});
  }

  var model = new THREE.Group();
  model.position.set(0, -WARD_CONFIG.cageH/2 + 0.15, 0);
  stageModelParts = {};

  // Dispatch to species-specific builder
  var species = (patient.species||'dog').toLowerCase();
  if(species==='cat')         buildCatGeometry(model, mkMat);
  else if(species==='rabbit') buildRabbitGeometry(model, mkMat);
  else if(species==='bird')   buildBirdGeometry(model, mkMat);
  else                        buildDogGeometry(model, mkMat); // dog + fallback

  // Attach to kennel
  stageKm.group.add(model);
  stageModel = model;
}

// ----- DOG: longer snout, floppy ears, wagging tail -----
function buildDogGeometry(model, mkMat) {
  var S=0.75; model.scale.set(S,S,S);

  // BODY — longer, lower profile than cat
  var body=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12), mkMat('body'));
  body.scale.set(1.5,0.85,1.0); body.position.set(0,0.42,0);
  stageModelParts['body']=[body]; model.add(body);

  // HEAD — larger, more elongated
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.35,16,12), mkMat('head'));
  head.scale.set(1,0.95,1.1); head.position.set(0,0.78,0.7);
  stageModelParts['head']=[head]; model.add(head);

  // SNOUT — long and pronounced
  var snout=new THREE.Mesh(new THREE.SphereGeometry(0.17,10,10), new THREE.MeshStandardMaterial({color:0x443322,roughness:0.8}));
  snout.scale.set(0.9,0.65,1.3); snout.position.set(0,0.68,1.0); model.add(snout);

  // EARS — floppy rectangles hanging down
  [-0.22,0.22].forEach(function(ex){
    var ear=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.25,0.08), mkMat('head'));
    ear.position.set(ex,0.85,0.6);
    ear.rotation.z=ex>0?-0.2:0.2;
    stageModelParts['head'].push(ear); model.add(ear);
  });

  // EYES
  [-0.13,0.13].forEach(function(ex){
    var eye=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),
      new THREE.MeshStandardMaterial({color:0x2a1a0a,emissive:new THREE.Color(0x000000)}));
    eye.position.set(ex,0.88,0.98); model.add(eye);
  });

  // NOSE — big black dog nose
  var nose=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),
    new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.3}));
  nose.position.set(0,0.73,1.16); model.add(nose);

  // LEGS
  addLegs(model, mkMat, 0.07, 0.45, 0.25, 0.32);

  // TAIL — thick, wagging
  stageModelParts['tail']=[];

// Shared leg helper for dog/cat
function addLegs(model, mkMat, radius, length, xOff, zOff) {
  if(!stageModelParts['left_leg']) stageModelParts['left_leg']=[];
  if(!stageModelParts['right_leg']) stageModelParts['right_leg']=[];
  var legDefs=[
    {name:'left_leg',  x:-xOff, z: zOff},
    {name:'left_leg',  x:-xOff, z:-zOff},
    {name:'right_leg', x: xOff, z: zOff},
    {name:'right_leg', x: xOff, z:-zOff},
  ];
  legDefs.forEach(function(lp){
    var leg=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius*0.85,length,8), mkMat(lp.name));
    leg.position.set(lp.x, length/2 - 0.05 + 0.03, lp.z);
    stageModelParts[lp.name].push(leg); model.add(leg);
    var paw=new THREE.Mesh(new THREE.SphereGeometry(radius*1.3,8,6), mkMat(lp.name));
    paw.scale.set(1,0.55,1.2); paw.position.set(lp.x,-0.04,lp.z);
    stageModelParts[lp.name].push(paw); model.add(paw);
  });
}

function highlightStagePart(partName) {
  Object.entries(stageModelParts).forEach(function(kv){
    kv[1].forEach(function(mesh){
      if(!mesh.material) return;
      if(kv[0]===partName){
        mesh.material.emissive = new THREE.Color(0x00aaff);
        mesh.material.emissiveIntensity = 1.0;
      } else {
        var restoredEmi=0x000000, restoredInt=0;
        if(dtPatient && dtPatient.conditions){
          var c=dtPatient.conditions.find(function(cc){return cc.part===kv[0];});
          if(c){
            restoredEmi = c.severity>=3?EMIT_CRIT:c.severity>=2?EMIT_WARN:EMIT_OK;
            restoredInt = c.severity>=2?0.5:0.3;
          }
        }
        mesh.material.emissive = new THREE.Color(restoredEmi);
        mesh.material.emissiveIntensity = restoredInt;
      }
    });
  });
}

// Animate stage model breathing/tail-wag in main loop
function updateStageModelAnim(t) {
  if(!stageModel||!dtPatient) return;
  var breathRate = dtPatient.temp>39.5 ? 3.5 : 1.8;
  if(stageModelParts.body && stageModelParts.body[0])
    stageModelParts.body[0].position.y = 0.45 + Math.sin(t*breathRate)*0.015;
  if(stageModelParts.head && stageModelParts.head[0])
    stageModelParts.head[0].position.y = 0.8 + Math.sin(t*breathRate)*0.015;
  if(stageModelParts.tail && stageModelParts.tail[0])
    stageModelParts.tail[0].rotation.y = Math.sin(t*(dtPatient.temp>39.5?4:2))*0.2;
  // Critical pulse
  if(dtPatient.conditions) {
    dtPatient.conditions.forEach(function(c){
      if(c.severity>=3 && stageModelParts[c.part]) {
        var pulse = 0.35 + Math.abs(Math.sin(t*3))*0.7;
        stageModelParts[c.part].forEach(function(m){ if(m.material) m.material.emissiveIntensity=pulse; });
      }
    });
  }
}

// ================================================================
function nowStr(){
  var n=new Date();
  return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+' '+n.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function logHistory(patientId, type, tag, msg) {
  if(!patientHistory[patientId]) patientHistory[patientId]=[];
  patientHistory[patientId].push({time:nowStr(), type:type, tag:tag, msg:msg});
  // Keep last 30 entries
  if(patientHistory[patientId].length>30) patientHistory[patientId].shift();
}
function addHistoryNote(patientId) {
  var note=prompt('Add note for patient log:');
  if(!note||!note.trim()) return;
  logHistory(patientId, 'info', 'NOTE', note.trim());
  if(currentPanelKm) renderTab(currentPanelKm);
  // Refresh left history panel if showing this patient
  if(dtPatient && dtPatient.id===patientId) renderHistoryPanel(dtPatient);
}

function showToast(msg) {
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--font-mono);font-size:11px;padding:8px 18px;border-radius:2px;z-index:9000;opacity:0;transition:opacity .3s;letter-spacing:1px';
  t.textContent=msg; document.body.appendChild(t);
  requestAnimationFrame(function(){t.style.opacity='1';setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},400);},1800);});
}

// ================================================================
// SEARCH
// ================================================================
function onSearch(val) {
  var results=document.getElementById('search-results');
  if(!val||val.length<1){results.style.display='none';return;}
  val=val.toLowerCase();
  var matches=[];
  Object.values(kennelData).forEach(function(p){
    if(p.name.toLowerCase().indexOf(val)>=0||p.id.toLowerCase().indexOf(val)>=0||p.species.toLowerCase().indexOf(val)>=0){
      matches.push(p);
    }
  });
  if(!matches.length){results.style.display='none';return;}
  var html='';
  matches.slice(0,8).forEach(function(p){
    var maxSev=0;(p.conditions||[]).forEach(function(c){if(c.severity>maxSev)maxSev=c.severity;});
    var sc=maxSev>=3||p.temp>39.5?'#ff3d3d':maxSev>=2?'#ffcc00':'#00e676';
    html+='<div class="search-result-item" onclick="jumpToPatient(\''+p.kennelKey+'\')">';
    html+='<div><div class="sri-name">'+p.name+'</div><div class="sri-loc">'+p.species.toUpperCase()+' · '+p.kennelKey+'</div></div>';
    html+='<div style="font-family:var(--font-mono);font-size:9px;color:'+sc+'">'+p.temp.toFixed(1)+'°C</div>';
    html+='</div>';
  });
  results.innerHTML=html; results.style.display='block';
}

function searchKeyDown(e){if(e.key==='Enter')execSearch();}
function execSearch(){
  var val=document.getElementById('search-input').value.trim().toLowerCase();
  if(!val) return;
  var match=Object.values(kennelData).find(function(p){return p.name.toLowerCase().indexOf(val)>=0||p.id.toLowerCase().indexOf(val)>=0;});
  if(match){jumpToPatient(match.kennelKey);} else{showToast('No patient found: '+val);}
}

function jumpToPatient(kennelKey) {
  document.getElementById('search-results').style.display='none';
  document.getElementById('search-input').value='';
  var km=kennelMeshes.find(function(k){return k.key===kennelKey;});
  if(!km) return;
  selectedKennel=km; focusKennel(km); refreshAllKennels();
  openPanel(km); updateBreadcrumb(km.side,km.row+1,km.col+1);
}

function setupNavDropdowns() {
  var cfg=WARD_CONFIG;
  var rowSel=document.getElementById('sel-row');
  var colSel=document.getElementById('sel-col');
  for(var r=0;r<cfg.rows;r++){var o=document.createElement('option');o.value=r;o.textContent='ROW '+(r+1);rowSel.appendChild(o);}
  for(var c=0;c<cfg.cols;c++){var o2=document.createElement('option');o2.value=c;o2.textContent='COL '+(c+1);colSel.appendChild(o2);}
}

function navSelect() {
  var side=document.getElementById('sel-side').value;
  var row=document.getElementById('sel-row').value;
  var col=document.getElementById('sel-col').value;
  kennelMeshes.forEach(function(km){
    var match=true;
    if(side&&km.side!==side)match=false;
    if(row!==''&&km.row!==parseInt(row))match=false;
    if(col!==''&&km.col!==parseInt(col))match=false;
    if(match&&(side||row!==''||col!=='')){
      km.interior.material.emissiveIntensity=0.8;
      setTimeout(function(){updateKennelVisual(km,kennelData[km.key]||null,false);},600);
    }
  });
  if(side&&row!==''&&col!==''){
    var target=kennelMeshes.find(function(km){return km.side===side&&km.row===parseInt(row)&&km.col===parseInt(col)&&km.level===0;});
    if(target){selectedKennel=target;focusKennel(target);openPanel(target);updateBreadcrumb(target.side,target.row+1,target.col+1);refreshAllKennels();}
  }
}

// ================================================================
// STATS
// ================================================================
function updateStats() {
  var ok=0,warn=0,crit=0,empty=0;
  kennelMeshes.forEach(function(km){
    var p=kennelData[km.key]||null;
    var st=getPatientStatus(p);
    if(st==='empty')empty++;
    else if(st==='crit')crit++;
    else if(st==='warn')warn++;
    else ok++;
  });
  document.getElementById('st-ok').textContent=ok+' OK';
  document.getElementById('st-warn').textContent=warn+' WARN';
  document.getElementById('st-crit').textContent=crit+' CRIT';
  document.getElementById('st-empty').textContent=empty+' EMPTY';
  updateNotifBadge(crit, warn);
}

// ================================================================
// NOTIFICATIONS — bell in topbar
// ================================================================
function updateNotifBadge(crit, warn) {
  var notif=document.getElementById('tb-notif');
  var count=document.getElementById('tb-notif-count');
  var total=crit+warn;
  count.textContent=total;
  notif.classList.toggle('alert', crit>0);
  if(total===0) count.style.display='none';
}

function toggleNotifPanel(e) {
  e.stopPropagation();
  var panel=document.getElementById('tb-notif-panel');
  var showing=panel.classList.contains('show');
  if(!showing){ renderNotifPanel(); }
  panel.classList.toggle('show');
}

function renderNotifPanel() {
  var panel=document.getElementById('tb-notif-panel');
  var crits=[], warns=[];
  Object.values(kennelData).forEach(function(p){
    var st=getPatientStatus(p);
    if(st==='crit') crits.push(p);
    else if(st==='warn') warns.push(p);
  });
  var html='<div class="notif-header"><span>&#9888; ALERTS</span><span style="color:var(--muted)">'+(crits.length+warns.length)+' active</span></div>';
  if(crits.length+warns.length===0){
    html+='<div class="notif-empty">&#10003; All patients stable</div>';
  } else {
    crits.forEach(function(p){
      html+='<div class="notif-item" onclick="jumpToPatient(\''+p.kennelKey+'\');document.getElementById(\'tb-notif-panel\').classList.remove(\'show\')">';
      html+='<div class="notif-dot crit"></div>';
      html+='<div class="notif-body"><div class="notif-name">'+p.name+' · CRITICAL</div>';
      html+='<div class="notif-meta">'+p.species.toUpperCase()+' · '+cToF(p.temp).toFixed(1)+'°F · '+p.heartRate+'bpm · '+p.kennelKey+'</div>';
      html+='</div></div>';
    });
    warns.forEach(function(p){
      html+='<div class="notif-item" onclick="jumpToPatient(\''+p.kennelKey+'\');document.getElementById(\'tb-notif-panel\').classList.remove(\'show\')">';
      html+='<div class="notif-dot warn"></div>';
      html+='<div class="notif-body"><div class="notif-name">'+p.name+' · WARNING</div>';
      html+='<div class="notif-meta">'+p.species.toUpperCase()+' · '+cToF(p.temp).toFixed(1)+'°F · '+p.heartRate+'bpm · '+p.kennelKey+'</div>';
      html+='</div></div>';
    });
  }
  panel.innerHTML=html;
}

// ================================================================
// MINIMAP — both stack levels shown
// Layout per row-slot: [LV1 top strip] [LV0 bottom strip]
// ================================================================
function updateMinimap() {
  var cvs=document.getElementById('minimap-canvas');
  var ctx=cvs.getContext('2d');
  var W=cvs.width, H=cvs.height;
  ctx.fillStyle='#07090f'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0d1828'; ctx.fillRect(W/2-14,0,28,H); // aisle

  var cfg=WARD_CONFIG;
  var cw=Math.floor((W/2-20)/cfg.cols);
  // Each row-slot is split into 2 level cells stacked vertically
  var slotH=Math.floor((H-10)/cfg.rows);
  var lh0=Math.floor(slotH*0.55); // LV0 (lower) takes 55%
  var lh1=slotH-lh0-1;             // LV1 (upper) takes rest

  minimapCells=[];

  kennelMeshes.forEach(function(km){
    var p=kennelData[km.key]||null;
    var st=getPatientStatus(p);
    var col=st==='crit'?'#8b0000':st==='warn'?'#6b5000':st==='ok'?'#0d3321':'#1a2840';
    var isLeft=km.side==='LEFT';
    var bx=isLeft?(W/2-16-cw)-km.col*(cw+1):(W/2+16)+km.col*(cw+1);
    var slotY=4+km.row*(slotH+1);
    // LV1 is drawn on top of the slot, LV0 on bottom
    var by=km.level===1 ? slotY : slotY+lh1+1;
    var bh=km.level===1 ? lh1 : lh0;

    ctx.fillStyle=col; ctx.fillRect(bx,by,cw-1,bh);

    // Level label for LV1
    if(km.level===1){
      ctx.fillStyle='rgba(0,180,220,0.4)'; ctx.fillRect(bx,by,3,bh);
    }

    // Selection ring
    if(selectedKennel&&selectedKennel.key===km.key){
      ctx.strokeStyle='#00d4ff'; ctx.lineWidth=1.5; ctx.strokeRect(bx,by,cw-1,bh);
    }
    minimapCells.push({key:km.key,x:bx,y:by,w:cw-1,h:bh});

    // Status dot
    if(p&&st!=='empty'){
      ctx.fillStyle=st==='crit'?'#ff3d3d':st==='warn'?'#ffcc00':'#00e676';
      ctx.beginPath(); ctx.arc(bx+(cw-1)/2,by+bh/2,1.5,0,Math.PI*2); ctx.fill();
    }
  });

  // Level legend
  ctx.fillStyle='rgba(0,180,220,0.5)'; ctx.fillRect(3,H-18,3,6);
  ctx.fillStyle='rgba(80,80,80,0.8)'; ctx.font='7px monospace'; ctx.fillText('L2',7,H-13);
  ctx.fillStyle='rgba(80,80,80,0.8)'; ctx.fillRect(3,H-10,3,6);
  ctx.fillStyle='rgba(80,80,80,0.8)'; ctx.fillText('L1',7,H-5);
}

function onMinimapClick(e) {
  var cvs=document.getElementById('minimap-canvas');
  var rect=cvs.getBoundingClientRect();
  var mx=e.clientX-rect.left, my=e.clientY-rect.top;
  // Scale to canvas coords
  var sx=mx*(cvs.width/rect.width), sy=my*(cvs.height/rect.height);
  for(var i=0;i<minimapCells.length;i++){
    var c=minimapCells[i];
    if(sx>=c.x&&sx<=c.x+c.w&&sy>=c.y&&sy<=c.y+c.h){
      var km=kennelMeshes.find(function(k){return k.key===c.key;});
      if(km){selectedKennel=km;focusKennel(km);refreshAllKennels();openPanel(km);updateBreadcrumb(km.side,km.row+1,km.col+1);}
      return;
    }
  }
}

// ================================================================
// HEATMAP OVERLAY
// ================================================================
function toggleHeatmap() {
  heatmapVisible=!heatmapVisible;
  document.getElementById('heatmap-toggle-btn').classList.toggle('active',heatmapVisible);
  var overlay=document.getElementById('heatmap-overlay');
  overlay.classList.toggle('show', heatmapVisible);
  if(heatmapVisible) drawHeatmap();
}

function drawHeatmap() {
  var cvs=document.getElementById('heatmap-main-canvas');
  var wrap=document.getElementById('canvas-wrap');
  // Size canvas to match canvas-wrap
  cvs.style.position='absolute'; cvs.style.top='0'; cvs.style.left='0';
  cvs.width=wrap.clientWidth; cvs.height=wrap.clientHeight;
  var ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,cvs.width,cvs.height);

  // Project ALL kennel levels to screen
  kennelMeshes.forEach(function(km){
    var p=kennelData[km.key]||null;
    var st=getPatientStatus(p);
    if(st==='empty') return;

    var worldPos=new THREE.Vector3(km.x,km.y,km.z);
    var screenPos=worldPos.clone().project(camera);
    if(screenPos.z>=1) return; // behind camera
    var sx=(screenPos.x+1)/2*cvs.width;
    var sy=(-screenPos.y+1)/2*cvs.height;
    // Clip to canvas bounds
    if(sx<-100||sx>cvs.width+100||sy<-100||sy>cvs.height+100) return;

    var maxSev=0;(p.conditions||[]).forEach(function(c){if(c.severity>maxSev)maxSev=c.severity;});
    var hasFever=p.temp>39.5;
    // Level 1 is upper stack — slightly smaller radius
    var rBase=maxSev>=3||hasFever?70:maxSev>=2?50:35;
    var r=km.level>0?rBase*0.7:rBase;
    var colStr=maxSev>=3||hasFever?'255,61,61':maxSev>=2?'255,204,0':'0,230,118';

    var grad=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
    grad.addColorStop(0,'rgba('+colStr+','+(km.level>0?0.35:0.45)+')');
    grad.addColorStop(1,'rgba('+colStr+',0)');
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();

    // Label — level indicator
    ctx.fillStyle='rgba('+colStr+',0.95)';
    ctx.font='bold '+(km.level>0?9:10)+'px Share Tech Mono,monospace';
    ctx.textAlign='center';
    ctx.fillText(p.name+(km.level>0?' ▲':''), sx, sy+2);
    // Temp
    ctx.font='8px Share Tech Mono,monospace';
    ctx.fillStyle='rgba('+colStr+',0.7)';
    ctx.fillText(p.temp.toFixed(1)+'°C', sx, sy+12);
  });

  // Click handler — find nearest kennel across ALL levels
  cvs.onclick=function(e){
    if(!heatmapVisible) return;
    var rect=cvs.getBoundingClientRect();
    var mx=e.clientX-rect.left, my=e.clientY-rect.top;
    var best=null, bestDist=60;
    kennelMeshes.forEach(function(km){
      var wp=new THREE.Vector3(km.x,km.y,km.z);
      var sp=wp.clone().project(camera);
      if(sp.z>=1) return;
      var sx=(sp.x+1)/2*cvs.width, sy=(-sp.y+1)/2*cvs.height;
      var dist=Math.hypot(mx-sx,my-sy);
      if(dist<bestDist){bestDist=dist;best=km;}
    });
    if(best){selectedKennel=best;focusKennel(best);refreshAllKennels();openPanel(best);updateBreadcrumb(best.side,best.row+1,best.col+1);}
  };
}

function setView(v) {
  currentView=v;
  document.getElementById('btn-view-3d').classList.toggle('active',v==='3d');
  document.getElementById('btn-view-top').classList.toggle('active',v==='top');
  if(v==='top'){camState.h=0;camState.v=1.4;camState.dist=18;camTarget.set(0,0,0);updateCamera();}
  else resetCamera();
  if(heatmapVisible) setTimeout(drawHeatmap,200);
}

// ================================================================
// ANIMATION LOOP
// ================================================================
var animT=0;
function animate() {
  requestAnimationFrame(animate);
  var dt=clock?clock.getDelta():0.016; animT+=dt;

  // Stage animation — move kennel group
  updateStageAnimation(dt);
  // Apply drag rotation to staged cage
  if(stageKm && stageActive){
    stageKm.group.rotation.y = stageRotY;
    stageKm.group.rotation.x = stageRotX;
  } else if(stageKm){
    // Smoothly zero out rotation during return
    stageKm.group.rotation.y *= 0.9;
    stageKm.group.rotation.x *= 0.9;
  }
  // Stage model (cat/dog) breathing + tail wag
  updateStageModelAnim(animT);
  // Walkout animation (patient steps out, spins, returns)
  updateWalkout(dt);

  // Stage spotlight — fade in when active
  if(window._stageSpot){
    var targetInt = (stageActive||stageAnimating) ? 3.5 : 0;
    window._stageSpot.intensity += (targetInt - window._stageSpot.intensity) * 0.08;
  }
  // Stage ring — pulse when active, dim otherwise
  if(window._stageRingMat){
    var ringTarget = (stageActive||stageAnimating) ? (0.5 + Math.abs(Math.sin(animT*2))*0.5) : 0.18;
    window._stageRingMat.emissiveIntensity += (ringTarget - window._stageRingMat.emissiveIntensity) * 0.1;
    window._stageRingMat.opacity += (((stageActive||stageAnimating)?0.75:0.35) - window._stageRingMat.opacity) * 0.08;
  }

  // Camera: when stage is active, lerp to front-stage position.
  // During walkout, pull camera back so full patient body fits in frame.
  if(stageActive || stageAnimating) {
    var camTargetPosStage = STAGE_CAM_POS;
    if(walkoutState){
      // Pull back and up so the walking patient + cage both fit
      if(!window._walkoutCamPos) window._walkoutCamPos = new THREE.Vector3(0, 1.9, 8.2);
      camTargetPosStage = window._walkoutCamPos;
    }
    camera.position.lerp(camTargetPosStage, 0.06);
    // Also slide look-at target forward a bit during walkout so framing centers on patient mid-trip
    var lookTarget = STAGE_CENTER;
    if(walkoutState){
      if(!window._walkoutLook) window._walkoutLook = new THREE.Vector3(0, 0.9, 3.3);
      lookTarget = window._walkoutLook;
    }
    camTarget.lerp(lookTarget, 0.06);
    camera.lookAt(camTarget);
  } else {
    camera.position.lerp(camTargetPos, 0.08);
    camera.lookAt(camTarget);
  }

  var pulse=Math.abs(Math.sin(animT*2.5));
  kennelMeshes.forEach(function(km){
    var p=kennelData[km.key]||null;
    if(!p) return;
    var maxSev=0;(p.conditions||[]).forEach(function(c){if(c.severity>maxSev)maxSev=c.severity;});
    var isCrit=maxSev>=3||p.temp>39.5;
    if(isCrit){km.interior.material.emissiveIntensity=0.15+pulse*0.45;km.statusLight.material.emissiveIntensity=0.4+pulse*0.7;}
    var isWarn=maxSev===2&&!isCrit;
    if(isWarn){km.interior.material.emissiveIntensity=0.1+Math.abs(Math.sin(animT*1.2))*0.25;}
  });
  if(heatmapVisible) drawHeatmap();
  positionStageHUD();
  renderer.render(scene,camera);
}

function handleFile(e) {
  var file=e.target.files[0]; if(!file) return;
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:function(r){processCSV(r.data);}});
}

function processCSV(rows) {
  kennelData={};
  var grouped={};
  rows.forEach(function(r){
    if(!r.id) return;
    var kennelKey=r.kennel?r.kennel.trim():null;
    if(!kennelKey){
      var idx=Object.keys(grouped).indexOf(r.id);
      if(idx<0){idx=Object.keys(grouped).length;}
      var side=idx<10?'LEFT':'RIGHT';
      var pos=idx%10; var row=Math.floor(pos/WARD_CONFIG.cols); var col=pos%WARD_CONFIG.cols;
      kennelKey=side+'-'+row+'-'+col+'-0';
    }
    if(!grouped[r.id]){grouped[r.id]={id:r.id,name:r.name||'Unknown',species:r.species||'dog',temp:parseFloat(r.temp)||38.5,heartRate:parseFloat(r.heartRate)||100,status:r.status||'normal',conditions:[],kennelKey:kennelKey};}
    if(r.part&&r.part.trim()){grouped[r.id].conditions.push({part:r.part.trim(),condition:r.condition||'?',severity:parseInt(r.severity)||0});}
  });
  Object.values(grouped).forEach(function(p){
    kennelData[p.kennelKey]=p;
    // Auto-log admission if no history yet
    if(!patientHistory[p.id]||patientHistory[p.id].length===0){
      var st=getPatientStatus(p);
      logHistory(p.id, st==='crit'?'crit':st==='warn'?'warn':'info', 'ADMIT', 'Admitted · '+p.species.toUpperCase()+' · '+p.temp.toFixed(1)+'°C · '+p.heartRate+' bpm');
      if(p.temp>39.5) logHistory(p.id,'crit','FEVER','Temperature '+p.temp.toFixed(1)+'°C exceeds 39.5°C threshold');
      (p.conditions||[]).forEach(function(c){
        if(c.severity>=3) logHistory(p.id,'crit','SEV3',c.part.replace(/_/g,' ')+': '+c.condition);
        else if(c.severity>=2) logHistory(p.id,'warn','SEV2',c.part.replace(/_/g,' ')+': '+c.condition);
      });
    }
  });
  refreshAllKennels();
}

// ================================================================
// EXPORT CSV
// ================================================================
function exportCSV() {
  var rows=['id,name,species,temp,heartRate,status,part,condition,severity,kennel'];
  Object.values(kennelData).forEach(function(p){
    if(p.conditions&&p.conditions.length){
      p.conditions.forEach(function(c){
        rows.push([p.id,p.name,p.species,p.temp.toFixed(1),p.heartRate,p.status,c.part,c.condition,c.severity,p.kennelKey].join(','));
      });
    } else {
      rows.push([p.id,p.name,p.species,p.temp.toFixed(1),p.heartRate,p.status,'body','healthy',1,p.kennelKey].join(','));
    }
  });
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='vetward_export_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV exported ✓');
}
